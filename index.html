<title>월간 행정 체크리스트</title>
<style>
  :root { --bg: #F1F3F5; --surface: #FFFFFF; --ink: #1B2430; --muted: #5F6B7A; --line: #D3D9E0; --accent: #1F4E8C; --bad: #B42318; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #12161C; --surface: #1A2029; --ink: #E6EAF0; --muted: #96A1AF; --line: #2C3542; --accent: #7BA4E3; --bad: #F07468; color-scheme: dark; }
  }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; padding: 16px; box-sizing: border-box; }
  form { width: min(100%, 340px); background: var(--surface); border: 1.5px solid var(--line); border-radius: 22px; padding: 28px 24px;
    display: flex; flex-direction: column; gap: 14px; box-sizing: border-box; }
  h1 { margin: 0; font-size: 20px; }
  p { margin: 0; font-size: 13px; color: var(--muted); }
  input[type="password"] { height: 42px; border: 1px solid var(--line); border-radius: 10px; padding: 0 12px; font-size: 16px;
    background: var(--bg); color: var(--ink); }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button { height: 42px; border: 0; border-radius: 10px; background: var(--accent); color: var(--surface); font-size: 15px; font-weight: 700; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  .err { color: var(--bad); font-weight: 700; }
</style>

<script>
(function () {
  const P = JSON.parse(document.getElementById('payload').textContent);
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const msg = document.getElementById('msg'), go = document.getElementById('go');

  async function derive(pw) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: b64(P.salt), iterations: P.iter, hash: 'SHA-256' }, base, 512);
    return new Uint8Array(bits);
  }
  async function open(keyBytes) {
    const iv = b64(P.iv), ct = b64(P.ct), mac = b64(P.mac);
    const signed = new Uint8Array(iv.length + ct.length); signed.set(iv); signed.set(ct, iv.length);
    const hk = await crypto.subtle.importKey('raw', keyBytes.slice(32), { name: 'HMAC', hash: 'SHA-256' }, false, ['verify']);
    if (!(await crypto.subtle.verify('HMAC', hk, mac, signed))) return false;
    const ak = await crypto.subtle.importKey('raw', keyBytes.slice(0, 32), { name: 'AES-CBC' }, false, ['decrypt']);
    const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-CBC', iv }, ak, ct));
    document.open(); document.write(html); document.close();
    return true;
  }
  // 비밀번호는 매번 입력: 예전 버전이 저장해 둔 열쇠는 지운다.
  try {
    for (const st of [localStorage, sessionStorage])
      for (let i = st.length - 1; i >= 0; i--) { const k = st.key(i); if (k && k.startsWith('admin-checklist-key-')) st.removeItem(k); }
  } catch (e) {}

  document.getElementById('f').addEventListener('submit', async e => {
    e.preventDefault();
    const pw = document.getElementById('pw').value;
    if (!pw) return;
    go.disabled = true; msg.className = ''; msg.textContent = '확인 중…';
    try {
      const k = await derive(pw);
      if (!(await open(k))) { msg.className = 'err'; msg.textContent = '비밀번호가 맞지 않습니다.'; go.disabled = false; }
    } catch (err) {
      msg.className = 'err'; msg.textContent = '이 브라우저에서는 열 수 없습니다. 최신 Chrome이나 Edge로 열어 주세요.'; go.disabled = false;
    }
  });
})();
</script>
